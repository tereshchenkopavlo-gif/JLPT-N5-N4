<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f1ede3"><title>帳場 · JLPT N5–N4 · v1</title><style>
:root{--bg:#f1ede3;--paper:#fffdf8;--ink:#292b29;--muted:#686b64;--line:#d7d5c9;--red:#923e36;--green:#355f4b;--soft:#e4ebdf;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Arial,"Noto Sans",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:10px 14px;min-height:44px}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a26423;outline-offset:3px}button:disabled{cursor:default;opacity:.65}input,select{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);max-width:100%}header{border-bottom:1px solid var(--line);background:var(--paper)}.header{max-width:1080px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:26px;font-weight:800}.brand[lang=ja]{line-height:1.3}nav button[lang=ja]{line-height:1.5}.brand small{font-size:12px;background:var(--red);color:white;padding:3px 7px;border-radius:4px;vertical-align:middle}.subtitle,.muted{color:var(--muted);font-size:14px}.levelbox{display:flex;gap:8px;align-items:center}nav{display:flex;gap:6px;max-width:1080px;margin:0 auto;padding:10px 24px;overflow-x:auto}nav button{background:transparent;border-color:transparent;white-space:nowrap}nav button[aria-current="page"]{background:var(--paper);border-color:var(--line);font-weight:bold}main{max-width:1080px;margin:18px auto 60px;padding:0 24px}h1{font-size:30px;line-height:1.25;margin:10px 0 16px}h2{font-size:22px;line-height:1.4;margin:0 0 12px}h3{font-size:18px;margin:12px 0}p{margin:10px 0}a{color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:16px 0}.stat{font-size:32px;font-weight:bold;color:var(--green)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}.primary{background:var(--green);color:white;border-color:var(--green)}.badge{font-size:12px;color:var(--green);background:var(--soft);padding:3px 8px;border-radius:20px;display:inline-block}.notice{border-left:4px solid #a26423;padding:10px 16px;background:#fbf4e6;margin:16px 0}.cardlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.item{text-align:left;display:block;width:100%;padding:16px;border-radius:12px;overflow-wrap:anywhere}.item strong{font-size:22px;display:block}.item small{display:block;color:var(--muted)}[lang=ja],.ja{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:2.1;overflow-wrap:anywhere;letter-spacing:normal}.example{font-size:21px;border-left:3px solid var(--green);padding:8px 16px;margin:18px 0;background:#f3f5ee}ruby{ruby-position:over}rt{font-size:.5em;font-weight:normal}.no-ruby rt{visibility:hidden}.translation{color:#555d53;font-size:16px;line-height:1.65;margin-top:8px}.rule{padding:12px;background:#eeeadd;border-radius:8px}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.choice{display:block;text-align:left;width:100%;margin:10px 0;padding:14px 16px;overflow-wrap:anywhere}.choice.correct{background:#e0ecdf;border:2px solid #416a4c;opacity:1}.choice.wrong{background:#f7e4e0;border:2px solid #9c3e31;opacity:1}.feedback{background:#eeeadd;padding:16px;border-radius:10px;margin:14px 0}.prompt{font-size:21px;line-height:1.8}.progress{height:6px;background:var(--line);border-radius:10px;margin:16px 0}.progress i{height:100%;display:block;background:var(--green);border-radius:10px}.reading{font-size:22px;line-height:2.4;white-space:pre-line}.reading mark{background:#f1e5bc;color:inherit}.readlayout{max-width:780px;margin:auto}.compact{font-size:14px}.selected{border:2px solid var(--green)}details{margin:16px 0}summary{cursor:pointer;font-weight:bold;min-height:44px;padding:8px}.empty{text-align:center;color:var(--muted);padding:30px}.danger{color:var(--red)}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#263b30;color:white;padding:12px 20px;border-radius:12px;z-index:5;max-width:90vw;box-shadow:0 4px 20px #0003}#storageError{background:#ffe4db;padding:12px;text-align:center}footer{font-size:13px;color:var(--muted);max-width:1080px;margin:auto;padding:0 24px 24px}.setting{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}.setting label{max-width:75%}.setting input[type=checkbox]{width:22px;height:22px;min-height:22px}dialog{width:min(760px,94vw);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0006}dialog .close{float:right}#search{width:100%;max-width:420px}.row>label{min-width:0;max-width:100%;overflow-wrap:anywhere}#importFile{width:100%;display:block}.quiet{background:transparent}.readinglist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grade-S{color:var(--green)}.grade-X{color:var(--red)}
@media(max-width:700px){.header{padding:14px 16px;gap:10px}.brand{font-size:23px}.subtitle{font-size:12px}.levelbox{font-size:13px}main{padding:0 14px}nav{padding:8px 10px;gap:0}nav button{padding:8px 10px;font-size:14px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid .panel{padding:12px;margin:10px 0}.stat{font-size:26px}.cardlist,.readinglist{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:18px}h1{font-size:25px}.reading{font-size:20px}.item{padding:12px}.item strong{font-size:20px}.prompt{font-size:18px}.example{font-size:19px}.header .subtitle{max-width:200px}.levelbox label{display:none}dialog{padding:18px}footer{padding:0 14px 20px}}
@media(max-width:360px){.cardlist,.readinglist{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.grid .panel{display:flex;align-items:center;gap:16px;margin:2px 0}}

<script id="course-data" type="application/json">{"vocab":[{"id":"v001","kind":"v","level":"N5","w":"人","r":"ひと","c":"іменник","t":"людина","usage":"Лічильник людей — 人: 一人（ひとり）, 二人（ふたり）, 三人（さんにん）.","ja":"あの[[人|ひと]]は[[先生|せんせい]]です。","uk":"Та людина — викладач."},{"id":"v002","kind":"v","level":"N5","w":"学生","r":"がくせい","c":"іменник","t":"студент; учень","usage":"Загальна назва того, хто навчається; для школярів також уживають 生徒.","ja":"[[兄|あに]]は[[大学|だいがく]]の[[学生|がくせい]]です。","uk":"Мій старший брат — студент університету."},{"id":"v003","kind":"v","level":"N5","w":"先生","r":"せんせい","c":"іменник","t":"учитель; викладач","usage":"Також шанобливе звертання до лікаря та деяких інших фахівців. Про власну професію доречне 教師.","ja":"[[先生|せんせい]]に[[質問|しつもん]]しました。","uk":"Я поставив запитання викладачеві."},{"id":"v004","kind":"v","level":"N5","w":"友達","r":"ともだち","c":"іменник","t":"друг; подруга","usage":"Число залежить від контексту: один друг або друзі.","ja":"[[友達|ともだち]]と[[映画|えいが]]を[[見|み]]ます。","uk":"Я подивлюся фільм із другом."},{"id":"v005","kind":"v","level":"N5","w":"家族","r":"かぞく","c":"іменник","t":"сім’я","usage":"Позначає сім’ю як групу; 家族がいます — мати сім’ю.","ja":"[[家族|かぞく]]は[[四人|よにん]]です。","uk":"У моїй сім’ї четверо людей."},{"id":"v006","kind":"v","level":"N5","w":"学校","r":"がっこう","c":"іменник","t":"школа; навчальний заклад","usage":"До місця руху: 学校に／へ行く; місце дії: 学校で勉強する.","ja":"[[毎日|まいにち]][[学校|がっこう]]へ[[行|い]]きます。","uk":"Я щодня ходжу до школи."},{"id":"v007","kind":"v","level":"N5","w":"駅","r":"えき","c":"іменник","t":"залізнична станція","usage":"駅で待つ — чекати на станції; 駅まで — до станції.","ja":"[[駅|えき]]で[[友達|ともだち]]を[[待|ま]]ちます。","uk":"Я чекатиму друга на станції."},{"id":"v008","kind":"v","level":"N5","w":"店","r":"みせ","c":"іменник","t":"магазин; заклад","usage":"店 може бути і магазином, і рестораном: значення уточнює контекст.","ja":"この[[店|みせ]]は[[九時|くじ]]に[[開|あ]]きます。","uk":"Цей магазин відчиняється о дев’ятій."},{"id":"v009","kind":"v","level":"N5","w":"部屋","r":"へや","c":"іменник","t":"кімната","usage":"部屋にいる — перебувати в кімнаті; 部屋で読む — читати в кімнаті.","ja":"この[[部屋|へや]]は[[静|しず]]かです。","uk":"У цій кімнаті тихо."},{"id":"v010","kind":"v","level":"N5","w":"本","r":"ほん","c":"іменник","t":"книжка","usage":"本を読む — читати книжку. Лічильник 本 для довгих предметів — інше вживання цього знака.","ja":"[[図書館|としょかん]]で[[本|ほん]]を[[借|か]]りました。","uk":"Я позичив книжку в бібліотеці."},{"id":"v011","kind":"v","level":"N5","w":"水","r":"みず","c":"іменник","t":"вода","usage":"Зазвичай вода звичайної температури; гаряча вода — お湯.","ja":"[[水|みず]]を[[一杯|いっぱい]]ください。","uk":"Дайте, будь ласка, склянку води."},{"id":"v012","kind":"v","level":"N5","w":"お茶","r":"おちゃ","c":"іменник","t":"чай","usage":"お — усталений ввічливий префікс. Без уточнення часто мається на увазі японський чай.","ja":"[[食事|しょくじ]]のあとでお[[茶|ちゃ]]を[[飲|の]]みます。","uk":"Після їжі я п’ю чай."},{"id":"v013","kind":"v","level":"N5","w":"ご飯","r":"ごはん","c":"іменник","t":"варений рис; їжа, прийом їжі","usage":"ご飯を食べる може означати «їсти», а не обов’язково «їсти рис».","ja":"[[七時|しちじ]]に[[朝|あさ]]ご[[飯|はん]]を[[食|た]]べます。","uk":"Я снідаю о сьомій."},{"id":"v014","kind":"v","level":"N5","w":"電車","r":"でんしゃ","c":"іменник","t":"електропоїзд; поїзд","usage":"電車で — поїздом; 電車に乗る — сісти в поїзд.","ja":"[[電車|でんしゃ]]で[[会社|かいしゃ]]へ[[行|い]]きます。","uk":"Я їду на роботу поїздом."},{"id":"v015","kind":"v","level":"N5","w":"時間","r":"じかん","c":"іменник","t":"час; година як тривалість","usage":"時間がある — мати час; 一時間 — протягом однієї години, 一時 — о першій.","ja":"[[毎日|まいにち]][[一時間|いちじかん]][[勉強|べんきょう]]します。","uk":"Я навчаюся щодня по годині."},{"id":"v016","kind":"v","level":"N5","w":"今日","r":"きょう","c":"іменник, обставинне вживання","t":"сьогодні","usage":"今日 зазвичай не потребує に, коли позначає час дії.","ja":"[[今日|きょう]]は[[学校|がっこう]]へ[[行|い]]きません。","uk":"Сьогодні я не піду до школи."},{"id":"v017","kind":"v","level":"N5","w":"明日","r":"あした","c":"іменник, обставинне вживання","t":"завтра","usage":"あした — звичайне повсякденне читання; існують також あす та формальніше みょうにち.","ja":"[[明日|あした]][[友達|ともだち]]に[[会|あ]]います。","uk":"Завтра я зустрінуся з другом."},{"id":"v018","kind":"v","level":"N5","w":"昨日","r":"きのう","c":"іменник, обставинне вживання","t":"учора","usage":"Звичайне читання — きのう; формальне — さくじつ.","ja":"[[昨日|きのう]]は[[雨|あめ]]でした。","uk":"Учора йшов дощ."},{"id":"v019","kind":"v","level":"N5","w":"朝","r":"あさ","c":"іменник","t":"ранок","usage":"毎朝 — щоранку; 朝ご飯 — сніданок.","ja":"[[朝|あさ]]はパンを[[食|た]]べます。","uk":"Уранці я їм хліб."},{"id":"v020","kind":"v","level":"N5","w":"夜","r":"よる","c":"іменник","t":"вечір; ніч","usage":"Точна українська відповідність залежить від часу й ситуації; 夜ご飯 — вечеря.","ja":"[[夜|よる]]はうちで[[本|ほん]]を[[読|よ]]みます。","uk":"Увечері я читаю книжку вдома."},{"id":"v021","kind":"v","level":"N5","w":"行く","r":"いく","c":"дієслово, група I","t":"іти; їхати","usage":"Напрям に／へ; транспорт で. て-форма виняткова: 行って.","ja":"[[日曜日|にちようび]]に[[京都|きょうと]]へ[[行|い]]きます。","uk":"У неділю я поїду до Кіото."},{"id":"v022","kind":"v","level":"N5","w":"来る","r":"くる","c":"дієслово, група III","t":"приходити; приїжджати","usage":"Рух до мовця або обраного центру ситуації. Форми: 来ます（きます）, 来て（きて）.","ja":"[[友達|ともだち]]がうちに[[来|き]]ます。","uk":"До мене додому прийде друг."},{"id":"v023","kind":"v","level":"N5","w":"帰る","r":"かえる","c":"дієслово, група I","t":"повертатися додому; повертатися","usage":"Попри закінчення える це група I: 帰って, 帰らない.","ja":"[[六時|ろくじ]]にうちへ[[帰|かえ]]ります。","uk":"О шостій я повертаюся додому."},{"id":"v024","kind":"v","level":"N5","w":"食べる","r":"たべる","c":"дієслово, група II","t":"їсти","usage":"Об’єкт із を: パンを食べる. て-форма — 食べて.","ja":"[[朝|あさ]]ご[[飯|はん]]を[[食|た]]べました。","uk":"Я поснідав."},{"id":"v025","kind":"v","level":"N5","w":"飲む","r":"のむ","c":"дієслово, група I","t":"пити","usage":"Об’єкт із を. 薬を飲む — приймати ліки; て-форма — 飲んで.","ja":"[[薬|くすり]]を[[水|みず]]で[[飲|の]]みます。","uk":"Я приймаю ліки, запиваючи водою."},{"id":"v026","kind":"v","level":"N5","w":"見る","r":"みる","c":"дієслово, група II","t":"дивитися; бачити","usage":"意図: 映画を見る — дивитися фільм. Видимість без активного спостереження часто передає 見える.","ja":"[[休|やす]]みの[[日|ひ]]に[[映画|えいが]]を[[見|み]]ます。","uk":"У вихідний я дивлюся фільми."},{"id":"v027","kind":"v","level":"N5","w":"聞く","r":"きく","c":"дієслово, група I","t":"слухати; запитувати","usage":"音楽を聞く — слухати музику; 先生に聞く — запитати викладача.","ja":"[[先生|せんせい]]に[[言葉|ことば]]の[[意味|いみ]]を[[聞|き]]きます。","uk":"Я запитаю викладача про значення слова."},{"id":"v028","kind":"v","level":"N5","w":"読む","r":"よむ","c":"дієслово, група I","t":"читати","usage":"Об’єкт із を; て-форма — 読んで.","ja":"[[寝|ね]]る[[前|まえ]]に[[本|ほん]]を[[読|よ]]みます。","uk":"Перед сном я читаю книжку."},{"id":"v029","kind":"v","level":"N5","w":"書く","r":"かく","c":"дієслово, група I","t":"писати","usage":"手紙を書く — писати листа; て-форма — 書いて.","ja":"ここに[[名前|なまえ]]を[[書|か]]いてください。","uk":"Напишіть тут своє ім’я, будь ласка."},{"id":"v030","kind":"v","level":"N5","w":"買う","r":"かう","c":"дієслово, група I","t":"купувати","usage":"Об’єкт із を, місце покупки з で; て-форма — 買って.","ja":"[[店|みせ]]でパンを[[買|か]]いました。","uk":"Я купив хліб у магазині."},{"id":"v031","kind":"v","level":"N5","w":"大きい","r":"おおきい","c":"い-прикметник","t":"великий","usage":"大きい部屋 — велика кімната; заперечення — 大きくない.","ja":"あの[[家|いえ]]は[[大|おお]]きいです。","uk":"Той будинок великий."},{"id":"v032","kind":"v","level":"N5","w":"小さい","r":"ちいさい","c":"い-прикметник","t":"маленький","usage":"小さい店 — маленький магазин; перед іменником також уживають 小さな.","ja":"[[小|ちい]]さいかばんを[[買|か]]いました。","uk":"Я купив маленьку сумку."},{"id":"v033","kind":"v","level":"N5","w":"高い","r":"たかい","c":"い-прикметник","t":"високий; дорогий","usage":"値段が高い — дорого; 山が高い — висока гора. Протилежність для ціни 安い, для висоти 低い.","ja":"このかばんは[[高|たか]]いです。","uk":"Ця сумка дорога."},{"id":"v034","kind":"v","level":"N5","w":"安い","r":"やすい","c":"い-прикметник","t":"дешевий; недорогий","usage":"Оцінка ціни, не висоти предмета. 安くなる — дешевшати.","ja":"この[[店|みせ]]のパンは[[安|やす]]いです。","uk":"Хліб у цьому магаз  гуляти вранці."},{"id":"v051","kind":"v","level":"N4","w":"生活","r":"せいかつ","c":"іменник, する","t":"повсякденне життя; побут","usage":"生活する — жити, вести повсякденне життя; не біологічне існування як таке.","ja":"[[日本|にほん]]の[[生活|せいかつ]]に[[慣|な]]れました。","uk":"Я звик до життя в Японії."},{"id":"v052","kind":"v","level":"N4","w":"気分","r":"きぶん","c":"іменник","t":"самопочуття; настрій","usage":"気分が悪い часто означає фізичне нездужання; переклад залежить від контексту.","ja":"[[少|すこ]]し[[休|やす]]んだら、[[気分|きぶん]]がよくなりました。","uk":"Після короткого відпочинку мені стало краще."},{"id":"v053","kind":"v","level":"N4","w":"熱","r":"ねつ","c":"іменник","t":"жар; підвищена температура","usage":"熱がある — мати підвищену температуру; також фізичне тепло.","ja":"[[熱|ねつ]]があるので、[[学校|がっこう]]を[[休|やす]]みます。","uk":"У мене температура, тому я пропущу заняття."},{"id":"v054","kind":"v","level":"N4","w":"事故","r":"じこ","c":"іменник","t":"аварія; нещасний випадок","usage":"事故が起こる — стається аварія; 事故に遭う — потрапити в аварію.","ja":"[[事故|じこ]]で[[電車|でんしゃ]]が[[止|と]]まっています。","uk":"Через аварію поїзди не рухаються."},{"id":"v055","kind":"v","level":"N4","w":"住所","r":"じゅうしょ","c":"іменник","t":"адреса проживання","usage":"住所を書く — записати адресу; не електронна адреса メールアドレス.","ja":"ここに[[住所|じゅうしょ]]を[[書|か]]いてください。","uk":"Напишіть тут свою адресу."},{"id":"v056","kind":"v","level":"N4","w":"場所","r":"ばしょ","c":"іменник","t":"місце","usage":"Позначає місце ширше, ніж поштова адреса; 集まる場所 — місце збору.","ja":"[[会|あ]]う[[場所|ばしょ]]を[[決|き]]めましょう。","uk":"Визначмо місце зустрічі."},{"id":"v057","kind":"v","level":"N4","w":"理由","r":"りゆう","c":"іменник","t":"причина; підстава","usage":"理由を説明する — пояснити причину; なぜに відповідає пояснення причини.","ja":"[[遅|おく]]れた[[理由|りゆう]]を[[説明|せつめい]]しました。","uk":"Я пояснив причину запізнення."},{"id":"v058","kind":"v","level":"N4","w":"意見","r":"いけん","c":"іменник","t":"думка; погляд щодо питання","usage":"意見を言う — висловити думку. Відрізняється від відповіді на фактичне запитання.","ja":"みなさんの[[意見|いけん]]を[[聞|き]]きたいです。","uk":"Я хочу почути ваші думки."},{"id":"v059","kind":"v","level":"N4","w":"必要","r":"ひつよう","c":"な-прикметник, іменник","t":"необхідний; потреба","usage":"必要な物 — необхідні речі; 物が必要です — потрібна річ.","ja":"[[予約|よやく]]には[[名前|なまえ]]と[[電話番号|でんわばんごう]]が[[必要|ひつよう]]です。","uk":"Для бронювання потрібні ім’я та номер телефону."},{"id":"v060","kind":"v","level":"N4","w":"便利","r":"べんり","c":"な-прикметник","t":"зручний; практичний","usage":"便利な場所 — зручне місце; про корисність і зручність користування.","ja":"このアプリは[[便利|べんり]]です。","uk":"Цей застосунок зручний."},{"id":"v061","kind":"v","level":"N4","w":"大切","r":"たいせつ","c":"な-прикметник","t":"важливий; дорогий, цінний для когось","usage":"大切な人 — дорога людина; 大切にする — берегти, цінувати.","ja":"[[友達|ともだち]]を[[大切|たいせつ]]にしています。","uk":"Я ціную своїх друзів."},{"id":"v062","kind":"v","level":"N4","w":"残念","r":"ざんねん","c":"な-прикметник","t":"прикрий; шкода","usage":"残念ですが — на жаль; про розчарування через нездійснене очікування.","ja":"[[会|あ]]えなくて[[残念|ざんねん]]です。","uk":"Шкода, що не вдасться зустрітися."},{"id":"v063","kind":"v","level":"N4","w":"決める","r":"きめる","c":"дієслово, група II","t":"вирішувати; визначати","usage":"Перехідне: 日にちを決める — визначити дату. 決まる — дата визначається.","ja":"[[旅行|りょこう]]の[[日|ひ]]を[[決|き]]めました。","uk":"Ми визначили дату подорожі."},{"id":"v064","kind":"v","level":"N4","w":"変える","r":"かえる","c":"дієслово, група II","t":"змінювати щось","usage":"Перехідне: 予定を変える. Неперехідне 変わる — щось змінюється.","ja":"[[雨|あめ]]なので、[[予定|よてい]]を[[変|か]]えました。","uk":"Через дощ ми змінили плани."},{"id":"v065","kind":"v","level":"N4","w":"変わる","r":"かわる","c":"дієслово, група I","t":"змінюватися","usage":"Неперехідне: 予定が変わる. Не прямий відповідник «змінити щось».","ja":"[[会議|かいぎ]]の[[時間|じかん]]が[[変|か]]わりました。","uk":"Час наради змінився."},{"id":"v066","kind":"v","level":"N4","w":"続ける","r":"つづける","c":"дієслово, група II","t":"продовжувати щось","usage":"Перехідне: 勉強を続ける. Після основи іншого дієслова: 読み続ける.","ja":"[[日本語|にほんご]]の[[勉強|べんきょう]]を[[続|つづ]]けます。","uk":"Я продовжуватиму вивчати японську."},{"id":"v067","kind":"v","level":"N4","w":"間に合う","r":"まにあう","c":"дієслово, група I","t":"встигати","usage":"Момент або подія з に: 電車に間に合う — встигнути на поїзд.","ja":"[[急|いそ]]げば、[[電車|でんしゃ]]に[[間|ま]]に[[合|あ]]います。","uk":"Якщо поквапитися, встигнемо на поїзд."},{"id":"v068","kind":"v","level":"N4","w":"遅れる","r":"おくれる","c":"дієслово, група II","t":"запізнюватися; затримуватися","usage":"約束の時間に遅れる — запізнитися на домовлений час. Не тотожне «не встигнути на транспорт».","ja":"[[電車|でんしゃ]]が[[十分|じゅっぷん]][[遅|おく]]れています。","uk":"Поїзд запізнюється на десять хвилин."},{"id":"v069","kind":"v","level":"N4","w":"忘れる","r":"わすれる","c":"дієслово, група II","t":"забувати","usage":"約束を忘れる — забути домовленість; 傘を家に忘れる — залишити парасольку вдома через забудькуватість.","ja":"[[家|いえ]]にかさを[[忘|わす]]れました。","uk":"Я забув парасольку вдома."},{"id":"v070","kind":"v","level":"N4","w":"思い出す","r":"おもいだす","c":"дієслово, група I","t":"згадувати","usage":"Відновити щось у пам’яті; не «запам’ятати», для якого потрібне 覚える.","ja":"[[友達|ともだち]]の[[名前|なまえ]]を[[思|おも]]い[[出|だ]]しました。","uk":"Я згадав ім’я друга."},{"id":"v071","kind":"v","level":"N4","w":"調べる","r":"しらべる","c":"дієслово, група II","t":"перевіряти; з’ясовувати; шукати відомості","usage":"辞書で調べる — перевірити у словнику; не пошук загубленого предмета 探す.","ja":"[[電車|でんしゃ]]の[[時間|じかん]]を[[調|しら]]べました。","uk":"Я перевірив час відправлення поїзда."},{"id":"v072","kind":"v","level":"N4","w":"探す","r":"さがす","c":"дієслово, група I","t":"шукати людину, річ, місце","usage":"なくした物を探す — шукати загублену річ; 仕事を探す — шукати роботу.","ja":"[[部屋|へや]]でかぎを[[探|さが]]しています。","uk":"Я шукаю ключ у кімнаті."},{"id":"v073","kind":"v","level":"N4","w":"手伝う","r":"てつだう","c":"дієслово, група I","t":"допомагати з роботою або справою","usage":"人を／仕事を手伝う — допомагати людині або з певною справою.","ja":"[[母|はは]]の[[料理|りょうり]]を[[手伝|てつだ]]いました。","uk":"Я допоміг мамі готувати."},{"id":"v074","kind":"v","level":"N4","w":"運ぶ","r":"はこぶ","c":"дієслово, група I","t":"переносити; перевозити","usage":"物を場所に運ぶ — доставляти предмет у певне місце; て-форма 運んで.","ja":"いすを[[隣|となり]]の[[部屋|へや]]に[[運|はこ]]びます。","uk":"Я перенесу стілець у сусідню кімнату."},{"id":"v075","kind":"v","level":"N4","w":"選ぶ","r":"えらぶ","c":"дієслово, група I","t":"вибирати","usage":"Кілька варіантів — 複数から選ぶ. て-форма 選んで.","ja":"[[好き|すき]]な[[色|いろ]]を[[選|えら]]んでください。","uk":"Виберіть колір, який вам подобається."},{"id":"v076","kind":"v","level":"N4","w":"伝える","r":"つたえる","c":"дієслово, група II","t":"передавати інформацію; повідомляти","usage":"人に内容を伝える — передати комусь зміст. 伝わる — інформація доходить.","ja":"[[先生|せんせい]]に[[欠席|けっせき]]すると[[伝|つた]]えました。","uk":"Я повідомив викладачеві, що буду відсутній."},{"id":"v077","kind":"v","level":"N4","w":"比べる","r":"くらべる","c":"дієслово, група II","t":"порівнювати","usage":"AとBを比べる — порівнювати A і B; AをBと比べる — зіставити A з B.","ja":"[[二|ふた]]つの[[店|みせ]]の[[値段|ねだん]]を[[比|くら]]べました。","uk":"Я порівняв ціни у двох магазинах."},{"id":"v078","kind":"v","level":"N4","w":"慣れる","r":"なれる","c":"дієслово, група II","t":"звикати","usage":"Об’єкт звикання з に: 生活に慣れる; 慣れている — уже звиклий стан.","ja":"[[新|あたら]]しい[[仕事|しごと]]に[[慣|な]]れました。","uk":"Я звик до нової роботи."},{"id":"v079","kind":"v","level":"N4","w":"集まる","r":"あつまる","c":"дієслово, група I","t":"збиратися разом","usage":"Неперехідне: 人が集まる. 集める — збирати когось або щось.","ja":"[[十時|じゅうじ]]に[[駅|えき]]の[[前|まえ]]に[[集|あつ]]まりましょう。","uk":"Зберімося о десятій перед станцією."},{"id":"v080","kind":"v","level":"N4","w":"迎える","r":"むかえる","c":"дієслово, група II","t":"зустрічати когось, хто прибуває","usage":"人を迎える — зустріти гостя; 迎えに行く — піти чи поїхати зустрічати.","ja":"[[駅|えき]]へ[[友達|ともだち]]を[[迎|むか]]えに[[行|い]]きます。","uk":"Я поїду на станцію зустрічати друга."}],"grammar":[{"id":"g001","kind":"g","level":"N5","w":"NはNです","c":"Тема й присудок","t":"Щодо N: це N; ввічливе іменне речення.","rule":"Іменник＋は＋іменник＋です.","usage":"は позначає тему й читається わ. です робить іменний присудок ввічливим; не додавайте です безпосередньо до звичайної стверджувальної форми дієслова.","ja":"[[私|わたし]]は[[学生|がくせい]]です。","uk":"Я студент."},{"id":"g002","kind":"g","level":"N5","w":"Nも","c":"Частки","t":"Також; теж.","rule":"Іменник＋も. Замість тематичного は або підметового が у базових реченнях.","usage":"も додає елемент до вже згаданого: «і я також». Після деяких інших часток можливі сполуки: にも, でも.","ja":"[[田中|たなか]]さんは[[学生|がくせい]]です。[[私|わたし]]も[[学生|がくせい]]です。","uk":"Танака — студент. Я теж студент."},{"id":"g003","kind":"g","level":"N5","w":"NのN","c":"Частки","t":"Належність або зв’язок між іменниками.","rule":"Іменник＋の＋іменник.","usage":"の не означає лише власника: 日本語の本 — книжка японською або про японську, залежно від контексту. Уточнюйте реальний зв’язок.","ja":"これは[[友達|ともだち]]の[[本|ほん]]です。","uk":"Це книжка друга."},{"id":"g004","kind":"g","level":"N5","w":"NをV","c":"Частки","t":"Позначення прямого об’єкта дії.","rule":"Іменник＋を＋перехідне дієслово.","usage":"を читається お. У цьому записі вивчаємо об’єкт: 水を飲む. Інші функції を, наприклад маршрут, не слід автоматично переносити сюди.","ja":"パンを[[食|た]]べます。","uk":"Я їм хліб."},{"id":"g005","kind":"g","level":"N5","w":"場所でV","c":"Частки","t":"Місце, де відбувається дія.","rule":"Іменник місця＋で＋дієслово дії.","usage":"Для існування з いる／ある зазвичай потрібне に: 部屋にいる. で також має інші функції, зокрема засіб, але тут ідеться про місце дії.","ja":"[[図書館|としょかん]]で[[勉強|べんきょう]]します。","uk":"Я навчаюся в бібліотеці."},{"id":"g006","kind":"g","level":"N5","w":"場所にいる／ある","c":"Існування","t":"Хтось або щось перебуває в певному місці.","rule":"Місце＋に＋людина/тварина＋がいる; місце＋に＋предмет＋がある.","usage":"いる зазвичай для людей і тварин; ある — для неживих предметів. Для теми можна вжити は: 本は机の上にあります.","ja":"[[部屋|へや]]に[[猫|ねこ]]がいます。","uk":"У кімнаті є кіт."},{"id":"g007","kind":"g","level":"N5","w":"Vます／ません","c":"Ввічливі форми","t":"Ввічлива стверджувальна або заперечна неминула дія.","rule":"Основа ます＋ます／ません. 食べる→食べます, 行く→行きます, する→します, 来る→来ます（きます）.","usage":"Неминулий час охоплює звичку й майбутню дію. Це не окрема форма теперішньої тривалої дії.","ja":"[[明日|あした]]は[[学校|がっこう]]へ[[行|い]]きません。","uk":"Завтра я не піду до школи."},{"id":"g008","kind":"g","level":"N5","w":"Vました／ませんでした","c":"Ввічливі форми","t":"Ввічлива минула дія або її заперечення.","rule":"Основа ます＋ました／ませんでした.","usage":"Це форми дієслова. Для іменників і な-прикметників минула зв’язка でした, для い-прикметників — ～かったです.","ja":"[[昨日|きのう]]、[[映画|えいが]]を[[見|み]]ました。","uk":"Учора я подивився фільм."},{"id":"g009","kind":"g","level":"N5","w":"Vてください","c":"Прохання","t":"Будь ласка, зробіть.","rule":"て-форма дієслова＋ください.","usage":"Ввічливе пряме прохання або інструкція. Міжособистісна доречність залежить від ситуації: це не завжди найм’якший спосіб просити.","ja":"ここに[[名前|なまえ]]を[[書|か]]いてください。","uk":"Напишіть тут ім’я, будь ласка."},{"id":"g010","kind":"g","level":"N5","w":"Vたい","c":"Бажання","t":"Хочу зробити.","rule":"Основа ます＋たい: 食べます→食べたい.","usage":"Змінюється як い-прикметник: たくない, たかった. Зазвичай власне бажання або запитання про бажання співрозмовника; не приписуйте чужі внутрішні бажання без контексту.","ja":"[[日本|にほん]]へ[[行|い]]きたいです。","uk":"Я хочу поїхати до Японії."},{"id":"g011","kind":"g","level":"N5","w":"Vませんか","c":"Запрошення","t":"Чи не зробити нам разом…?","rule":"Основа ます＋ませんか.","usage":"У контексті спільної дії це запрошення, а не звичайне заперечення. Порівнюйте із ましょう, яке прямо пропонує діяти разом.","ja":"いっしょにお[[茶|ちゃ]]を[[飲|の]]みませんか。","uk":"Може, вип’ємо разом чаю?"},{"id":"g012","kind":"g","level":"N5","w":"Vている","c":"Стан і тривалість","t":"Дія триває; також стан як результат зміни.","rule":"て-форма дієслова＋いる／います.","usage":"З 読む часто означає «зараз читає». З 結婚する — стан «одружений», а не постійне одружування. Значення залежить від дієслова й контексту.","ja":"[[今|いま]]、[[本|ほん]]を[[読|よ]]んでいます。","uk":"Зараз я читаю книжку."},{"id":"g013","kind":"g","level":"N4","w":"Vたことがある","c":"Досвід","t":"Колись робив; маю такий досвід.","rule":"た-форма＋ことがある／あります.","usage":"Про досвід до теперішнього моменту. Для конкретної минулої події зі вказаним моментом часто природніше просте ～ました.","ja":"[[京都|きょうと]]へ[[行|い]]ったことがあります。","uk":"Я бував у Кіото."},{"id":"g014","kind":"g","level":"N4","w":"VたりVたりする","c":"Перелік дій","t":"Робити то одне, то інше; зокрема такі дії.","rule":"た-форма＋り, た-форма＋り＋する.","usage":"Перелік невичерпний і не гарантує хронологічного порядку. Час і ввічливість виражає завершальне する／しました.","ja":"[[休|やす]]みの[[日|ひ]]は[[本|ほん]]を[[読|よ]]んだり、[[映画|えいが]]を[[見|み]]たりします。","uk":"У вихідні я, наприклад, читаю книжки й дивлюся фільми."},{"id":"g015","kind":"g","level":"N4","w":"Vながら","c":"Одночасність","t":"Робити одну дію, одночасно виконуючи іншу.","rule":"Основа ます＋ながら＋основна дія.","usage":"Для цього значення обидві дії зазвичай має виконувати та сама особа. Основна дія стоїть у другій частині.","ja":"[[音楽|おんがく]]を[[聞|き]]きながら、[[料理|りょうり]]をします。","uk":"Я готую, слухаючи музику."},{"id":"g016","kind":"g","level":"N4","w":"Vておく","c":"Підготовка","t":"Зробити заздалегідь для подальшої потреби.","rule":"て-форма＋おく／おきます.","usage":"Також може означати залишити певний стан. Не будь-яка завершена дія є підготовкою: важливий контекст майбутньої потреби.","ja":"[[旅行|りょこう]]の[[前|まえ]]にホテルを[[予約|よやく]]しておきます。","uk":"Перед подорожжю я заздалегідь забронюю готель."},{"id":"g017","kind":"g","level":"N4","w":"Vてしまう","c":"Завершення й небажаний результат","t":"Завершити дію; зробити щось із відтінком жалю або несподіваності.","rule":"て-форма＋しまう／しまいます.","usage":"Жаль не обов’язковий: 全部読んでしまう може просто означати дочитати все. 忘れてしまった часто передає прикрість.","ja":"[[家|いえ]]にかさを[[忘|わす]]れてしまいました。","uk":"На жаль, я забув парасольку вдома."},{"id":"g018","kind":"g","level":"N4","w":"Vてみる","c":"Спроба","t":"Спробувати зробити й подивитися на результат.","rule":"て-форма＋みる／みます.","usage":"Це допоміжне みる, а не буквальне «дивитися». Для спроби почати дію, яка могла не вдатися, є інші конструкції.","ja":"この[[料理|りょうり]]を[[食|た]]べてみます。","uk":"Я спробую цю страву."},{"id":"g019","kind":"g","level":"N4","w":"Vる／Vないつもりだ","c":"Намір","t":"Маю намір зробити; не збираюся робити.","rule":"Словникова форма або ない-форма＋つもりです.","usage":"Виражає особистий намір. 予定 більше стосується запланованого розкладу або події; у деяких ситуаціях обидві форми можливі.","ja":"[[来年|らいねん]]、[[日本|にほん]]で[[働|はたら]]くつもりです。","uk":"Наступного року я маю намір працювати в Японії."},{"id":"g020","kind":"g","level":"N4","w":"Vることにする","c":"Рішення","t":"Вирішити зробити.","rule":"Словникова форма／ない-форма＋ことにする.","usage":"Наголос на власному рішенні. ことになる часто повідомляє про встановлену домовленість чи результат обставин без наголосу на особистому виборі.","ja":"[[毎朝|まいあさ]][[散歩|さんぽ]]することにしました。","uk":"Я вирішив щоранку гуляти."},{"id":"g021","kind":"g","level":"N4","w":"Vたほうがいい","c":"Порада","t":"Краще зробити; варто зробити.","rule":"た-форма＋ほうがいい. Заперечна порада: ない-форма＋ほうがいい.","usage":"た тут не означає, що дія вже відбулася. Пряма порада може звучати наполегливо, тому враховуйте стосунки та ситуацію.","ja":"[[早|はや]]く[[寝|ね]]たほうがいいです。","uk":"Варто раніше лягти спати."},{"id":"g022","kind":"g","level":"N4","w":"Vなければならない","c":"Необхідність","t":"Треба; необхідно зробити.","rule":"ない-форма без い＋ければならない: 行かない→行かなければならない.","usage":"Передає обов’язок або необхідність, не особисте бажання. У розмові існують скорочення, але тут вивчаємо повну форму.","ja":"[[明日|あした]]までにこの[[本|ほん]]を[[返|かえ]]さなければなりません。","uk":"До завтра я мушу повернути цю книжку."},{"id":"g023","kind":"g","level":"N4","w":"Vなくてもいい","c":"Відсутність необхідності","t":"Можна не робити; не обов’язково.","rule":"ない-форма без い＋くてもいい: 行かない→行かなくてもいい.","usage":"Це дозвіл не виконувати дію, а не заборона виконувати її. «Не можна робити» — てはいけない.","ja":"[[明日|あした]]は[[来|こ]]なくてもいいです。","uk":"Завтра можна не приходити."},{"id":"g024","kind":"g","level":"N4","w":"～ので","c":"Причина","t":"Оскільки; тому що.","rule":"Проста форма＋ので; іменник／な-прикметник＋なので.","usage":"Пояснює причину, часто як обставину ситуації. から теж виражає причину, але це не завжди взаємозамінні форми. Не називайте ので винятково об’єктивним або завжди ввічливішим.","ja":"[[雨|あめ]]なので、[[出|で]]かけません。","uk":"Оскільки йде дощ, я нікуди не піду."}],"questions":[{"id":"q001","target":"v001","type":"meaning","prompt":"あの人は先生です。人 — це…","choices":["людина","викладач","студент","друг"],"answer":0,"explain":"人 називає людину; у реченні це особа, про яку сказано, що вона викладач."},{"id":"q002","target":"v010","type":"reading","prompt":"Як читається 本 у значенні «книжка»?","choices":["ほん","はん","ぼん","ぽん"],"answer":0,"explain":"Самостійне слово 本 «книжка» читається ほん. Інші читання трапляються в сполуках і лічильниках."},{"id":"q003","target":"v014","type":"cloze","prompt":"毎朝、（　）で会社へ行きます。駅は家の近くです。","choices":["電車","電話","電気","電池"],"answer":0,"explain":"Йдеться про транспорт і станцію: 電車 — поїзд; 電話 — телефон, 電気 — електрика, 電池 — батарейка."},{"id":"q004","target":"v017","type":"meaning","prompt":"今日は月曜日です。明日、友達に会います。Коли зустріч?","choices":["у вівторок","у неділю","у понеділок","у середу"],"answer":0,"explain":"明日 — завтра. Якщо сьогодні понеділок, завтра вівторок."},{"id":"q005","target":"v023","type":"cloze","prompt":"仕事が終わりました。今からうちへ（　）。","choices":["帰ります","始まります","起きます","貸します"],"answer":0,"explain":"Після завершення роботи людина повертається додому: 帰ります. Інші дієслова не виражають цього руху."},{"id":"q006","target":"v025","type":"cloze","prompt":"この薬は、食事のあとで水で（　）ください。","choices":["飲んで","食べて","読んで","聞いて"],"answer":0,"explain":"Для приймання ліків японською вживають 薬を飲む. 水で — запиваючи водою."},{"id":"q007","target":"v033","type":"meaning","prompt":"このかばんは一万円です。高いですね。Що тут означає 高い?","choices":["дорогий","високий на зріст","великий за розміром","важкий за вагою"],"answer":0,"explain":"Зазначена ціна, тому 高い означає «дорогий». В інших контекстах воно може означати «високий»."},{"id":"q008","target":"v037","type":"cloze","prompt":"今日は三十五度です。とても（　）です。","choices":["暑い","熱い","寒い","冷たい"],"answer":0,"explain":"За температури повітря 35 °C йдеться про спеку: 暑い. 熱い — гарячий предмет або напій, 冷たい — холодний на дотик."},{"id":"q009","target":"v045","type":"cloze","prompt":"旅行の日が決まったので、ホテルの部屋を（　）しました。","choices":["予約","約束","説明","相談"],"answer":0,"explain":"Кімнату в готелі бронюють: 予約する. 約束 — домовленість/обіцянка, 説明 — пояснення, 相談 — порада або обговорення."},{"id":"q010","target":"v048","type":"cloze","prompt":"仕事で困っています。どうしたらいいか、先生に（　）したいです。","choices":["相談","予約","準備","経験"],"answer":0,"explain":"Коли хочуть обговорити проблему й отримати пораду, вживають 相談する."},{"id":"q011","target":"v064","type":"cloze","prompt":"雨が降りそうなので、私が旅行の予定を（　）ました。","choices":["変え","変わり","集まり","慣れ"],"answer":0,"explain":"Прямий об’єкт 予定を й дія особи потребують перехідного 変える. 変わる — змінюватися: 予定が変わる."},{"id":"q012","target":"v065","type":"cloze","prompt":"会議は三時からでしたが、時間が（　）、四時からになりました。","choices":["変わって","変えて","比べて","探して"],"answer":0,"explain":"時間が変わる — час змінився. 変える вимагає іншої структури: хтось змінює час — 時間を変える."},{"id":"q013","target":"v070","type":"cloze","prompt":"名前を忘れていましたが、古い写真を見て（　）ました。","choices":["思い出し","約束し","予約し","準備し"],"answer":0,"explain":"Фотографія допомогла відновити ім’я в пам’яті: 思い出す — згадати."},{"id":"q014","target":"v071","type":"cloze","prompt":"知らない言葉の意味を辞書で（　）ます。","choices":["調べ","運び","迎え","集まり"],"answer":0,"explain":"Відомості перевіряють у словнику: 辞書で調べる. Інші варіанти не позначають пошук значення."},{"id":"q015","target":"v072","type":"cloze","prompt":"かぎが見つかりません。部屋の中を（　）います。","choices":["探して","比べて","伝えて","選んで"],"answer":0,"explain":"Шукають загублений ключ: 探す. Порівняння, передавання інформації та вибір не відповідають ситуації."},{"id":"q016","target":"v078","type":"cloze","prompt":"新しい仕事を始めて三か月です。やっと仕事に（　）ました。","choices":["慣れ","変え","決め","運び"],"answer":0,"explain":"仕事に慣れる — звикнути до роботи. Частка に відповідає об’єкту звикання."},{"id":"q017","target":"g001","type":"cloze","prompt":"私は学生（　）。","choices":["です","ます","でしたか","ましょう"],"answer":0,"explain":"Потрібне стверджувальне іменне речення «Я студент»: 学生です. ます приєднується до дієслівної основи, не до іменника."},{"id":"q018","target":"g002","type":"cloze","prompt":"田中さんは学生です。私（　）学生です。Я теж студент.","choices":["も","を","で","に"],"answer":0,"explain":"Додавання «теж» передає も. は могло б утворити інше природне речення, тому його не використано як нібито однозначно хибну відповідь."},{"id":"q019","target":"g003","type":"cloze","prompt":"これは私（　）本です。","choices":["の","を","に","で"],"answer":0,"explain":"の пов’язує власника з предметом: 私の本 — моя книжка."},{"id":"q020","target":"g004","type":"cloze","prompt":"毎朝、パン（　）食べます。","choices":["を","に","で","へ"],"answer":0,"explain":"パン — прямий об’єкт дії 食べる, тому потрібна частка を."},{"id":"q021","target":"g005","type":"cloze","prompt":"図書館（　）本を読みます。","choices":["で","に","へ","を"],"answer":0,"explain":"Для місця, де читають, уживають で. に позначає місце існування з いる／ある, а не місце цієї дії."},{"id":"q022","target":"g006","type":"cloze","prompt":"部屋に猫が（　）。","choices":["います","あります","します","なります"],"answer":0,"explain":"Про наявність живої тварини в місці кажуть います. あります тут не відповідає базовому розрізненню."},{"id":"q023","target":"g007","type":"cloze","prompt":"明日は学校へ（　）。Завтра я не піду до школи.","choices":["行きません","行きました","行っています","行きましょう"],"answer":0,"explain":"Неминула заперечна ввічлива форма — 行きません. Минуле, тривала дія та спільна пропозиція мають інші значення."},{"id":"q024","target":"g008","type":"cloze","prompt":"昨日、映画を（　）。Учора я подивився фільм.","choices":["見ました","見ます","見ません","見たいです"],"answer":0,"explain":"Конкретна завершена подія вчора виражається ввічливою минулою формою 見ました."},{"id":"q025","target":"g009","type":"cloze","prompt":"ここに名前を（　）ください。","choices":["書いて","書く","書き","書いた"],"answer":0,"explain":"Перед ください в проханні потрібна て-форма: 書く→書いて."},{"id":"q026","target":"g010","type":"cloze","prompt":"私は日本へ（　）です。Я хочу поїхати до Японії.","choices":["行きたい","行くたい","行ってたい","行ったたい"],"answer":0,"explain":"たい приєднується до основи ます: 行きます→行きたい."},{"id":"q027","target":"g011","type":"meaning","prompt":"いっしょにお茶を飲みませんか。Що робить мовець?","choices":["запрошує випити чаю разом","забороняє пити чай","повідомляє, що вже випив чай","просить принести чай"],"answer":0,"explain":"いっしょに та ませんか утворюють запрошення до спільної дії."},{"id":"q028","target":"g012","type":"meaning","prompt":"今、本を読んでいます。Що відбувається?","choices":["людина зараз читає","людина збирається почати завтра","людина вже повернула книжку","людина ніколи не читала"],"answer":0,"explain":"今 разом із 読んでいます указує на дію, яка триває зараз."},{"id":"q029","target":"g013","type":"meaning","prompt":"京都へ行ったことがあります。Що можна стверджувати?","choices":["людина вже бувала в Кіото","людина зараз їде до Кіото","людина планує поїхати до Кіото","людина має поїхати до Кіото"],"answer":0,"explain":"たことがある означає наявність досвіду. Точний час поїздки речення не повідомляє."},{"id":"q030","target":"g014","type":"meaning","prompt":"休みの日は本を読んだり、映画を見たりします。Що означає перелік?","choices":["це приклади занять у вихідні","це обов’язковий порядок двох дій","ці дії відбуваються одночасно","ці дії дозволені лише один раз"],"answer":0,"explain":"たり…たり подає невичерпний перелік; не задає послідовності чи одночасності."},{"id":"q031","target":"g015","type":"cloze","prompt":"音楽を（　）ながら、料理をします。","choices":["聞き","聞く","聞いて","聞いた"],"answer":0,"explain":"ながら для одночасних дій приєднується до основи ます: 聞きます→聞きながら."},{"id":"q032","target":"g016","type":"meaning","prompt":"旅行の前にホテルを予約しておきます。Який відтінок додає ておく?","choices":["завчасна підготовка до подорожі","жаль через помилкове бронювання","досвід попередніх бронювань","заборона змінювати готель"],"answer":0,"explain":"ておく указує на дію заздалегідь для майбутньої потреби."},{"id":"q033","target":"g017","type":"meaning","prompt":"大切なかさを忘れてしまいました。Який відтінок найприродніший тут?","choices":["жаль через те, що забув парасольку","намір залишити пара овленостей із друзями.","jaB":"ホテルの部屋を予約しました。","ukB":"Я забронював кімнату в готелі."},{"id":"p07","a":"v047","b":"v048","type":"related","note":"説明 — пояснення відомостей: 人に内容を説明する. 相談 — звернення по пораду або спільне обговорення проблеми: 人に／人と相談する. Пояснити проблему можна під час консультації, але ці слова називають різні дії.","jaA":"先生が文法を説明します。","ukA":"Викладач пояснює граматику.","jaB":"仕事のことを先生に相談します。","ukB":"Я пораджуся з викладачем щодо роботи."},{"id":"p08","a":"g005","b":"g006","type":"related","note":"Місце дії з で: 図書館で読む. Місце існування з に: 図書館にいる. Частку обирають за функцією присудка, а не за українським прийменником «у». Заміна で／に без зміни структури часто буде помилкою.","jaA":"図書館で本を読みます。","ukA":"Я читаю книжку в бібліотеці.","jaB":"図書館に友達がいます。","ukB":"У бібліотеці є мій друг."},{"id":"p09","a":"g007","b":"g008","type":"related","note":"ます／ません — ввічлива неминула форма; ました／ませんでした — минула. Основа та сама. Для вчорашньої завершеної дії потрібне ました, для звички чи плану на завтра — ます. Заперечення змінює факт дії, не лише час.","jaA":"明日、映画を見ます。","ukA":"Завтра подивлюся фільм.","jaB":"昨日、映画を見ました。","ukB":"Учора подивився фільм."},{"id":"p10","a":"g009","b":"g011","type":"related","note":"てください просить співрозмовника виконати дію; основа ます＋ませんか у контексті спільної дії запрошує. お茶を飲んでください — прохання/пропозиція випити, не запит «вип’ємо разом?».","jaA":"ここに名前を書いてください。","ukA":"Напишіть тут ім’я, будь ласка.","jaB":"いっしょにお茶を飲みませんか。","ukB":"Може, вип’ємо чаю разом?"},{"id":"p11","a":"g016","b":"g018","type":"related","note":"ておく — дія заздалегідь для майбутньої потреби; てみる — зробити пробу й перевірити результат. Приєднання однакове, значення різне. Можна спробувати бронювання чи забронювати завчасно, але це різні повідомлення.","jaA":"旅行の前にホテルを予約しておきます。","ukA":"Перед подорожжю забронюю готель заздалегідь.","jaB":"新しい料理を食べてみます。","ukB":"Спробую нову страву."},{"id":"p12","a":"g019","b":"g020","type":"related","note":"つもり — наявний намір, ことにする — ухвалення рішення. Обидві форми приєднуються до словникової або ない-форми. Рішення може сформувати намір, тому в деяких ситуаціях обидві конструкції природні, але акцент різний.","jaA":"来年、日本で働くつもりです。","ukA":"Маю намір наступного року працювати в Японії.","jaB":"来年、日本で働くことにしました。","ukB":"Я вирішив наступного року працювати в Японії."},{"id":"p13","a":"g022","b":"g023","type":"related","note":"なければならない — обов’язок зробити; なくてもいい — відсутність обов’язку. Останнє не забороняє дію. Обидві форми утворюються від ない-форми, але закінчення різні.","jaA":"明日は来なければなりません。","ukA":"Завтра треба прийти.","jaB":"明日は来なくてもいいです。","ukB":"Завтра можна не приходити."},{"id":"a01","a":"v031","b":"v032","type":"antonym","note":"Протилежність за розміром предмета; обидва — い-прикметники.","jaA":"大きいかばんです。","ukA":"Це велика сумка.","jaB":"小さいかばんです。","ukB":"Це маленька сумка."},{"id":"a02","a":"v033","b":"v034","type":"antonym","note":"Протилежні саме в значенні ціни: дорого/дешево. Для 高い «високий» протилежність 低い, а не 安い.","jaA":"このかばんは高いです。","ukA":"Ця сумка дорога.","jaB":"あのかばんは安いです。","ukB":"Та сумка недорога."},{"id":"a03","a":"v035","b":"v036","type":"antonym","note":"Протилежність «новий/старий» для речей. Не використовуйте 古い як звичайне означення літньої людини.","jaA":"新しい本を買いました。","ukA":"Я купив нову книжку.","jaB":"これは古い本です。","ukB":"Це стара книжка."},{"id":"a04","a":"v037","b":"v038","type":"antonym","note":"Протилежні щодо спеки й холоду в погоді. Для температури предмета потрібні 熱い／冷たい.","jaA":"今日は暑いです。","ukA":"Сьогодні спекотно.","jaB":"昨日は寒かったです。","ukB":"Учора було холодно."}],"readings":[{"id":"r001","level":"N5","title":"朝の時間","ja":"[[私|わたし]]は[[毎朝|まいあさ]][[六時|ろくじ]]に[[起|お]]きます。[[六時半|ろくじはん]]にパンを[[食|た]]べて、お[[茶|ちゃ]]を[[飲|の]]みます。[[七時|しちじ]]にうちを[[出|で]]ます。[[学校|がっこう]]へは[[電車|でんしゃ]]で[[行|い]]きます。[[授業|じゅぎょう]]は[[八時半|はちじはん]]からです。","uk":"Щоранку я прокидаюся о шостій. О пів на сьому їм хліб і п’ю чай. О сьомій виходжу з дому. До школи їду поїздом. Заняття починаються о пів на дев’яту.","targets":[["v019","毎朝"],["v012","お茶"],["v014","電車"],["g004","パンを食べて"]],"questions":[{"prompt":"О котрій людина виходить із дому?","choices":["о 7:00","о 6:00","о 6:30","о 8:30"],"answer":0,"explain":"Не плутайте час пробудження, сніданку, виходу й початку занять.","evidence":"七時にうちを出ます。"},{"prompt":"Як вона дістається до школи?","choices":["поїздом","пішки","велосипедом","автобусом"],"answer":0,"explain":"Засіб пересування прямо названо: 電車で.","evidence":"学校へは電車で行きます。"}]},{"id":"r002","level":"N5","title":"図書館で","ja":"[[今日|きょう]]は[[土曜日|どようび]]です。[[私|わたし]]は[[午前|ごぜん]][[十時|じゅうじ]]に[[図書館|としょかん]]へ[[行|い]]きます。そこで[[日本語|にほんご]]の[[本|ほん]]を[[読|よ]]みます。[[友達|ともだち]]は[[午後|ごご]][[一時|いちじ]]に[[来|き]]ます。いっしょに[[三時|さんじ]]まで[[勉強|べんきょう]]します。","uk":"Сьогодні субота. Я піду до бібліотеки о десятій ранку. Там читатиму книжку японською. Друг прийде о першій дня. Ми разом навчатимемося до третьої.","targets":[["v016","今日"],["v010","本"],["v004","友達"],["v022","来ます"]],"questions":[{"prompt":"Коли прийде друг?","choices":["о 13:00","о 10:00","о 12:00","о 15:00"],"answer":0,"explain":"午前十時 стосується мовця, а 午後一時 — друга.","evidence":"友達は午後一時に来ます。"},{"prompt":"До котрої вони навчатимуться разом?","choices":["до 15:00","до 10:00","до 13:00","до 16:00"],"answer":0,"explain":"まで позначає кінцеву межу часу.","evidence":"いっしょに三時まで勉強します。"}]},{"id":"r003","level":"N5","title":"かばんを買う","ja":"[[駅|えき]]の[[前|まえ]]に[[新|あたら]]しい[[店|みせ]]があります。[[私|わたし]]はそこでかばんを[[買|か]]いました。[[大|おお]]きいかばんは[[三千円|さんぜんえん]]で、[[小|ちい]]さいかばんは[[二千円|にせんえん]]でした。[[私|わたし]]の[[本|ほん]]は[[大|おお]]きいですから、[[大|おお]]きいかばんを[[買|か]]いました。","uk":"Перед станцією є новий магазин. Я купив там сумку. Велика коштувала три тисячі єн, а маленька — дві тисячі. Оскільки моя книжка велика, я купив велику сумку.","targets":[["v007","駅"],["v008","店"],["v031","大きい"],["v032","小さい"],["v030","買いました"]],"questions":[{"prompt":"Скільки коштувала придбана сумка?","choices":["3000 єн","2000 єн","1000 єн","5000 єн"],"answer":0,"explain":"Куплено велику сумку, а її ціна — 三千円.","evidence":"大きいかばんは三千円で、小さいかばんは二千円でした。"},{"prompt":"Чому обрано велику сумку?","choices":["книжка велика","вона дешевша","маленької не було","її попросив друг"],"answer":0,"explain":"Причину прямо названо; текст не стверджує відсутності маленьких сумок.","evidence":"私の本は大きいですから、大きいかばんを買いました。"}]},{"id":"r004","level":"N5","title":"部屋の猫","ja":"[[私|わたし]]の[[部屋|へや]]には[[小|ちい]]さい[[机|つくえ]]といすがあります。[[机|つくえ]]の[[上|うえ]]に[[本|ほん]]が[[三冊|さんさつ]]あります。[[猫|ねこ]]は[[机|つくえ]]の[[下|した]]で[[寝|ね]]ています。[[私|わたし]]は[[今|いま]]、いすに[[座|すわ]]って[[手紙|てがみ]]を[[書|か]]いています。","uk":"У моїй кімнаті є маленький стіл і стілець. На столі лежать три книжки. Кіт спить під столом. Зараз я сиджу на стільці й пишу листа.","targets":[["v009","部屋"],["v010","本"],["v029","書いています"],["g012","寝ています"]],"questions":[{"prompt":"Де спить кіт?","choices":["під столом","на столі","на стільці","під стільцем"],"answer":0,"explain":"Книжки на столі, а кіт під ним: 机の下.","evidence":"猫は机の下で寝ています。"},{"prompt":"Що зараз робить мовець?","choices":["пише листа","читає книжку","спить","годує кота"],"answer":0,"explain":"書いています позначає дію, що триває зараз.","evidence":"私は今、いすに座って手紙を書いています。"}]},{"id":"r005","level":"N5","title":"日曜日の約束","ja":"[[日曜日|にちようび]]、[[私|わたし]]は[[友達|ともだち]]と[[映画|えいが]]を[[見|み]]ます。[[映画|えいが]]は[[二時|にじ]]からですが、[[一時半|いちじはん]]に[[駅|えき]]の[[前|まえ]]で[[会|あ]]います。[[映画|えいが]]のあとで、お[[茶|ちゃ]]を[[飲|の]]みます。[[私|わたし]]はコーヒーが[[好|す]]きではありません。","uk":"У неділю я подивлюся фільм із другом. Фільм починається о другій, але ми зустрінемося перед станцією о пів на другу. Після фільму вип’ємо чаю. Я не люблю каву.","targets":[["v004","友達"],["v026","見ます"],["v007","駅"],["v039","好きではありません"]],"questions":[{"prompt":"Коли й де вони зустрінуться?","choices":["о 13:30 перед станцією","о 14:00 перед станцією","о 13:30 у кінотеатрі","о 14:00 у кав’ярні"],"answer":0,"explain":"Час початку фільму відрізняється від часу зустрічі.","evidence":"一時半に駅の前で会います。"},{"prompt":"Що заплановано після фільму?","choices":["випити чаю","купити книжку","піти до школи","повернутися одразу додому"],"answer":0,"explain":"あとで позначає дію після фільму.","evidence":"映画のあとで、お茶を飲みます。"}]},{"id":"r006","level":"N5","title":"お店のお知らせ","ja":"お[[知|し]]らせ\nこの[[店|みせ]]は[[毎日|まいにち]][[午前|ごぜん]][[九時|くじ]]から[[午後|ごご]][[七時|しちじ]]までです。[[水曜日|すいようび]]はお[[休|やす]]みです。[[今週|こんしゅう]]の[[金曜日|きんようび]]は、[[午後|ごご]][[五時|ごじ]]に[[閉|し]]まります。[[土曜日|どようび]]はいつもと[[同|おな]]じです。","uk":"Оголошення. Магазин працює щодня з дев’ятої ранку до сьомої вечора. Середа — вихідний. Цієї п’ятниці магазин зачиниться о п’ятій вечора. У суботу — звичайний розклад.","targets":[["v008","店"]],"questions":[{"prompt":"Коли магазин зачиниться цієї п’ятниці?","choices":["о 17:00","о 9:00","о 19:00","не працюватиме весь день"],"answer":0,"explain":"П’ятниця має винятковий скорочений час роботи.","evidence":"今週の金曜日は、午後五時に閉まります。"},{"prompt":"Якого дня магазин не працює?","choices":["у середу","у п’ятницю","у суботу","у неділю"],"answer":0,"explain":"Скорочений день у п’ятницю не означає вихідного.","evidence":"水曜日はお休みです。"}]},{"id":"r007","level":"N4","title":"待ち合わせの変更","ja":"[[明日|あした]]の[[待|ま]]ち[[合|あ]]わせについて[[連絡|れんらく]]します。[[朝|あさ]][[十時|じゅうじ]]に[[公園|こうえん]]で[[会|あ]]う[[予定|よてい]]でしたが、[[雨|あめ]]が[[降|ふ]]りそうなので、[[場所|ばしょ]]を[[変|か]]えましょう。[[駅|えき]]の[[前|まえ]]の[[喫茶店|きっさてん]]はどうですか。[[時間|じかん]]は[[変|か]]えません。よければ、[[今日|きょう]]の[[夜|よる]]までに[[返事|へんじ]]をください。","uk":"Пишу щодо завтрашньої зустрічі. Ми планували зустрітися в парку о десятій ранку, але, схоже, буде дощ, тож змінимо місце. Як щодо кав’ярні перед станцією? Час не змінюємо. Якщо підходить, дайте відповідь до сьогоднішнього вечора.","targets":[["v046","連絡"],["v041","予定"],["v056","場所"],["v064","変えましょう"]],"questions":[{"prompt":"Що пропонує змінити автор?","choices":["місце, залишивши час","час, залишивши місце","день і час","і час, і місце"],"answer":0,"explain":"Запропоновано кав’ярню замість парку; час залишається тим самим.","evidence":"時間は変えません。"},{"prompt":"До коли автор просить відповісти?","choices":["до сьогоднішнього вечора","до завтрашнього ранку","до завтра о 10:00","після зустрічі"],"answer":0,"explain":"今日の夜までに — до вечора сьогодні, не до самої зустрічі.","evidence":"よければ、今日の夜までに返事をください。"}]},{"id":"r008","level":"N4","title":"図書館の本を返す","ja":"[[図書館|としょかん]]で[[借|か]]りた[[本|ほん]]は[[明日|あした]]までに[[返|かえ]]さなければなりません。でも、[[明日|あした]]は[[仕事|しごと]]で[[帰|かえ]]りが[[遅|おそ]]くなります。[[友達|ともだち]]に[[相談|そうだん]]すると、「[[図書館|としょかん]]が[[閉|し]]まっていても、[[入口|いりぐち]]の[[箱|はこ]]に[[入|い]]れられるよ」と[[教|おし]]えてくれました。[[私|わたし]]は[[明日|あした]]の[[朝|あさ]]、[[会社|かいしゃ]]へ[[行|い]]く[[前|まえ]]に[[返|かえ]]すことにしました。","uk":"Книжку, позичену в бібліотеці, потрібно повернути до завтра. Але завтра через роботу я повернуся пізно. Я порадився з другом, і він пояснив: «Навіть коли бібліотека зачинена, книжку можна покласти в скриньку біля входу». Я вирішив повернути її завтра вранці перед роботою.","targets":[["v048","相談"],["g022","返さなければなりません"],["g020","返すことにしました"]],"questions":[{"prompt":"Як людина вирішила повернути книжку?","choices":["завтра вранці перед роботою","завтра після роботи","сьогодні через друга","після закінчення строку"],"answer":0,"explain":"Останнє речення повідомляє власне рішення мовця.","evidence":"私は明日の朝、会社へ行く前に返すことにしました。"},{"prompt":"Що пояснив друг?","choices":["книжку можна залишити в скриньці біля входу","строк можна продовжити без звернення","бібліотека завтра працює допізна","книжку дозволено залишити на роботі"],"answer":0,"explain":"Це правило описаної бібліотеки в навчальній історії, не універсальна інструкція для всіх бібліотек.","evidence":"図書館が閉まっていても、入口の箱に入れられるよ"}]},{"id":"r009","level":"N4","title":"料理を続ける","ja":"[[一人|ひとり]]で[[生活|せいかつ]]を[[始|はじ]]めたとき、[[毎日|まいにち]]コンビニでご[[飯|はん]]を[[買|か]]っていました。お[[金|かね]]がかかるので、[[自分|じぶん]]で[[料理|りょうり]]してみることにしました。[[最初|さいしょ]]は[[時間|じかん]]がかかりましたが、[[今|いま]]は[[少|すこ]]し[[慣|な]]れました。[[忙|いそが]]しい[[日|ひ]]のために、[[日曜日|にちようび]]に[[野菜|やさい]]を[[切|き]]っておきます。これからも[[料理|りょうり]]を[[続|つづ]]けるつもりです。","uk":"Коли я почав жити сам, щодня купував готову їжу в мінімаркеті. Це коштувало чимало, тому я вирішив спробувати готувати сам. Спочатку це забирало багато часу, але тепер я трохи звик. На зайняті дні я заздалегідь нарізаю овочі в неділю. Маю намір готувати й надалі.","targets":[["v051","生活"],["v078","慣れました"],["g016","切っておきます"],["g019","続けるつもり"]],"questions":[{"prompt":"Чому людина почала готувати?","choices":["купувати готову їжу було витратно","магазин закрився","вона почала працювати кухарем","друг попросив готувати для нього"],"answer":0,"explain":"Причину позначено お金がかかるので.","evidence":"お金がかかるので、自分で料理してみることにしました。"},{"prompt":"Для чого вона нарізає овочі в неділю?","choices":["щоб підготуватися до зайнятих днів","щоб повечеряти в ресторані","щоб повернути овочі в магазин","щоб навчити друга різати"],"answer":0,"explain":"ておく тут передає завчасну підготовку до майбутньої потреби.","evidence":"忙しい日のために、日曜日に野菜を切っておきます。"}]},{"id":"r010","level":"N4","title":"旅行の準備","ja":"[[来週|らいしゅう]]、[[友達|ともだち]]と[[旅行|りょこう]]します。[[私|わたし]]はホテルを[[予約|よやく]]して、[[友達|ともだち]]は[[電車|でんしゃ]]の[[時間|じかん]]を[[調|しら]]べました。ホテルにはタオルがありますから、[[持|も]]っていかなくてもいいです。でも、[[雨|あめ]]が[[降|ふ]]るかもしれないので、かさは[[必要|ひつよう]]です。[[当日|とうじつ]]は[[八時|はちじ]]に[[駅|えき]]に[[集|あつ]]まります。[[遅|おく]]れそうなときは、[[電話|でんわ]]で[[連絡|れんらく]]する[[約束|やくそく]]をしました。","uk":"Наступного тижня ми з другом подорожуватимемо. Я забронював готель, а друг перевірив час поїздів. У готелі є рушники, тому свої брати не обов’язково. Проте може піти дощ, тож потрібна парасолька. Того дня ми зберемося на станції о восьмій. Домовилися повідомляти телефоном, якщо хтось запізнюватиметься.","targets":[["v045","予約"],["v071","調べました"],["v059","必要"],["v079","集まります"],["g023","持っていかなくてもいい"]],"questions":[{"prompt":"Що брати не обов’язково?","choices":["рушник","парасольку","телефон","квиток"],"answer":0,"explain":"Текст скасовує необхідність брати рушник, бо він є в готелі; це не заборона.","evidence":"ホテルにはタオルがありますから、持っていかなくてもいいです。"},{"prompt":"Хто перевірив час поїздів?","choices":["друг","мовець","працівник готелю","обидва разом"],"answer":0,"explain":"Розподілено справи: мовець бронював, друг перевіряв розклад.","evidence":"友達は電車の時間を調べました。"}]},{"id":"r011","level":"N4","title":"忘れたかばん","ja":"[[買|か]]い[[物|もの]]から[[帰|かえ]]って、かばんがないことに[[気|き]]づきました。[[部屋|へや]]の[[中|なか]]を[[探|さが]]しましたが、[[見|み]]つかりません。[[今日|きょう]][[行|い]]った[[場所|ばしょ]]を[[考|かんが]]えていると、[[喫茶店|きっさてん]]のいすに[[置|お]]いたことを[[思|おも]]い[[出|だ]]しました。[[電話|でんわ]]をすると、[[店|みせ]]の[[人|ひと]]が「こちらにあります」と[[言|い]]いました。[[私|わたし]]は[[明日|あした]][[取|と]]りに[[行|い]]くと[[伝|つた]]えました。","uk":"Повернувшись із покупок, я помітив, що сумки немає. Пошукав у кімнаті, але не знайшов. Згадуючи місця, де побував сьогодні, я пригадав, що поклав її на стілець у кав’ярні. Коли я зателефонував, працівник сказав: «Вона в нас». Я повідомив, що заберу її завтра.","targets":[["v072","探しました"],["v056","場所"],["v070","思い出しました"],["v076","伝えました"]],"questions":[{"prompt":"Де залишилася сумка?","choices":["на стільці в кав’ярні","у кімнаті вдома","у поїзді","на касі магазину"],"answer":0,"explain":"Пошук почався вдома, але спогад і телефонна розмова вказують на кав’ярню.","evidence":"喫茶店のいすに置いたことを思い出しました。"},{"prompt":"Коли людина забере сумку?","choices":["завтра","сьогодні ввечері","наступного тижня","час ще не визначено"],"answer":0,"explain":"Час майбутньої дії повідомлено працівникові.","evidence":"私は明日取りに行くと伝えました。"}]},{"id":"r012","level":"N4","title":"朝の散歩","ja":"[[私|わたし]]は[[夜|よる]][[遅|おそ]]くまでスマートフォンを[[見|み]]ることが[[多|おお]]く、[[朝|あさ]]なかなか[[起|お]]きられませんでした。そこで、[[早|はや]]く[[寝|ね]]て、[[朝|あさ]][[散歩|さんぽ]]することにしました。[[始|はじ]]めたばかりのときは[[大変|たいへん]]でしたが、[[二週間|にしゅうかん]]ぐらいで[[慣|な]]れました。[[雨|あめ]]の[[日|ひ]]は[[外|そと]]へ[[出|で]]ないで、[[家|いえ]]で[[体|からだ]]を[[動|うご]]かします。[[毎日|まいにち]][[少|すこ]]しでも[[続|つづ]]けることが[[大切|たいせつ]]だと[[思|おも]]います。","uk":"Раніше я часто дивився в смартфон допізна й насилу прокидався вранці. Тому вирішив лягати раніше та гуляти вранці. На початку було важко, але приблизно за два тижні я звик. У дощові дні не виходжу надвір, а рухаюся вдома. Думаю, важливо продовжувати щодня хоча б потроху.","targets":[["v078","慣れました"],["v061","大切"],["g020","散歩することにしました"]],"questions":[{"prompt":"Що людина робить у дощові дні?","choices":["рухається вдома","гуляє довше з парасолькою","спить до обіду","переносить усі вправи на вихідні"],"answer":0,"explain":"Змінюється місце активності, а не відмова від звички.","evidence":"雨の日は外へ出ないで、家で体を動かします。"},{"prompt":"Який висновок робить автор?","choices":["важлива щоденна сталість навіть у малому","кожну прогулянку треба подовжувати","за два тижні можна припиняти","прогулянки корисні лише в ясну погоду"],"answer":0,"explain":"Останнє речення наголошує на 少しでも続ける — продовжувати хоча б потроху.","evidence":"毎日少しでも続けることが大切だと思います。"}]}]}</script><script>
'use strict';
const DATA=JSON.parse(document.getElementById('course-data').textContent);
const ITEMS=[...DATA.vocab,...DATA.grammar], BY_ID=Object.fromEntries(ITEMS.map(x=>[x.id,x]));
const QUESTIONS=[...DATA.questions,...DATA.readings.flatMap(r=>r.questions.map((q,i)=>({...q,id:r.id+'-q'+i,readingId:r.id})))];
const Q_BY_ID=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const STORAGE_KEY='jlptN5N4_uk_v1';
function initial(){return {app:'jlpt-n5-n4',version:1,settings:{level:'N5',includeN5:true,furigana:true,sessionSize:6},progress:{},compare:[],seenReadings:[],session:null}}
let state=initial(),view='home',cardKind='v',query='',gradeFilter='all',toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>String(s).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'$1');
function ruby(s){let at=0,out='';for(const m of String(s).matchAll(/\[\[([^|\]]+)\|([^\]]+)\]\]/g)){out+=esc(s.slice(at,m.index))+'<ruby>'+esc(m[1])+'<rt>'+esc(m[2])+'</rt></ruby>';at=m.index+m[0].length}return out+esc(s.slice(at))}
function notify(s){const e=document.getElementById('toast');e.textContent=s;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,4500)}
function validProgress(p){if(!p||typeof p!=='object'||Array.isArray(p))throw Error('Некоректний розділ прогресу.');const out={};for(const[id,x]of Object.entries(p)){if(!/^[vg]\d{3,}$/.test(id)||!x||!['S','G','X'].includes(x.grade))throw Error('Некоректний запис прогресу.');for(const k of['seen','correct','last','due'])if(!Number.isSafeInteger(x[k])||x[k]<0)throw Error('Некоректні лічильники прогресу.');if(x.correct>x.seen)throw Error('Правильних відповідей більше, ніж спроб.');out[id]={grade:x.grade,seen:x.seen,correct:x.correct,last:x.last,due:x.due}}return out}
function normalize(raw){if(!raw||raw.app!=='jlpt-n5-n4'||raw.version!==1)throw Error('Це не резервна копія JLPT N5–N4 підтримуваної версії.');const next=initial();next.progress=validProgress(raw.progress);const s=raw.settings;if(!s||!['N5','N4'].includes(s.level)||typeof s.includeN5!=='boolean'||typeof s.furigana!=='boolean'||![3,6,10].includes(s.sessionSize))throw Error('Некоректні налаштування.');next.settings={level:s.level,includeN5:s.includeN5,furigana:s.furigana,sessionSize:s.sessionSize};if(!Array.isArray(raw.compare)||!raw.compare.every(x=>typeof x==='string'&&/^[vg]\d{3,}$/.test(x)))throw Error('Некоректний список порівняння.');next.compare=[...new Set(raw.compare)].slice(0,30);if(!Array.isArray(raw.seenReadings)||!raw.seenReadings.every(x=>typeof x==='string'&&/^r\d{3,}$/.test(x)))throw Error('Некоректний список читання.');next.seenReadings=[...new Set(raw.seenReadings)];if(raw.session&&validSession(raw.session))next.session=raw.session;return next}
function validSession(s){return s&&['quiz','reading'].includes(s.type)&&Array.isArray(s.ids)&&s.ids.length>0&&s.ids.length<=10&&s.ids.every(id=>Q_BY_ID[id])&&Array.isArray(s.orders)&&s.orders.length===s.ids.length&&s.orders.every(a=>Array.isArray(a)&&a.length===4&&[...a].sort().join()==='0,1,2,3')&&Array.isArray(s.answers)&&s.answers.length===s.ids.length&&s.answers.every(a=>a===null||Number.isInteger(a)&&a>=0&&a<4)&&Number.isInteger(s.index)&&s.index>=0&&s.index<=s.ids.length&&(s.type!=='reading'||DATA.readings.some(r=>r.id===s.readingId&&s.ids.every(id=>Q_BY_ID[id].readingId===r.id)))}
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)state=normalize(JSON.parse(saved))}catch(e){document.getElementById('storageError').hidden=false}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));document.getElementById('storageError').hidden=true;return true}catch(e){document.getElementById('storageError').hidden=false;return false}}
function inLevel(x){return x.level===state.settings.level||(state.settings.level==='N4'&&state.settings.includeN5&&x.level==='N5')}
function available(){return ITEMS.filter(inLevel)}
function sync(){document.getElementById('level').value=state.settings.level;document.body.classList.toggle('no-ruby',!state.settings.furigana);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'))}
function go(v){view=v;render();window.scrollTo(0,0)}
function button(label,action,extra='',cls=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function peers(id,type){return DATA.pairs.filter(p=>(p.a===id||p.b===id)&&(!type||p.type===type))}
function itemName(x){return x.kind==='v'?ruby(`[[${x.w}|${x.r}]]`):esc(x.w)}
function gradeLabel(id){return {S:'Знаю',G:'Повторюю',X:'Складно'}[state.progress[id]?.grade]||'Нове'}
function render(){sync();const main=document.getElementById('main');if(view==='home')main.innerHTML=home();if(view==='cards')main.innerHTML=cards();if(view==='practice')main.innerHTML=practice();if(view==='compare')main.innerHTML=compare();if(view==='settings')main.innerHTML=settings()}
function home(){const list=available(),v=list.filter(x=>x.kind==='v'),g=list.filter(x=>x.kind==='g'),rr=DATA.readings.filter(inLevel),known=list.filter(x=>state.progress[x.id]?.grade==='S').length;return `<span class="badge">${state.settings.level}${state.settings.level==='N4'&&state.settings.includeN5?' + повторення N5':''}</span><h1>Трохи японської щодня.</h1><p>Слова в контексті, зрозуміла граматика й уважне читання.</p><div class="grid"><section class="panel"><div class="stat">${v.length}</div><div>слів у базі</div></section><section class="panel"><div class="stat">${g.length}</div><div>граматичних тем</div></section><section class="panel"><div class="stat">${rr.length}</div><div>текстів</div></section></div><section class="panel"><h2>Наступний крок</h2><p>Позначено «Знаю»: ${known} із ${list.length} карток. Картки без власних вправ теж доступні для вивчення й самооцінки.</p><div class="row">${button(state.session?'Продовжити вправи':'Почати вправи','practice','','primary')}${button('Читати текст','readings')}${button('Відкрити картки','cards')}</div></section><div class="notice"><b>Перший випуск — база розширюється.</b> Загалом ${DATA.vocab.length} слів, ${DATA.grammar.length} тем і ${DATA.readings.length} текстів. Це початкова перевірена партія, а не повне покриття N5 та N4.</div><p class="muted">Рівні — редакторський навчальний орієнтир. Сучасного офіційного вичерпного списку JLPT немає. Докладніше — у налаштуваннях.</p>`}
function cards(){const list=available().filter(x=>x.kind===cardKind).filter(x=>gradeFilter==='all'||(gradeFilter==='new'?!state.progress[x.id]:state.progress[x.id]?.grade===gradeFilter)).filter(x=>[x.w,x.r,x.t,x.usage].join(' ').toLowerCase().includes(query.toLowerCase()));return `<h1>Картки · ${state.settings.level}</h1><div class="row">${button('語彙 · Слова','kind','data-kind="v"',cardKind==='v'?'selected':'')}${button('文法 · Граматика','kind','data-kind="g"',cardKind==='g'?'selected':'')}</div><div class="row" style="margin-top:16px"><input id="search" type="search" placeholder="Слово, читання або український переклад" aria-label="Пошук карток" value="${esc(query)}"><select id="gradeFilter" aria-label="Стан вивчення">${[['all','Усі'],['new','Нові'],['G','Повторюю'],['X','Складно'],['S','Знаю']].map(([v,l])=>`<option value="${v}" ${v===gradeFilter?'selected':''}>${l}</option>`).join('')}</select></div><p class="muted">Знайдено: ${list.length}</p><div class="cardlist">${list.map(x=>`<button class="item" data-action="detail" data-id="${x.id}"><span class="badge">${x.level}</span><strong lang="ja">${itemName(x)}</strong><span>${esc(x.t)}</span><small>${esc(x.c)} · ${gradeLabel(x.id)}</small></button>`).join('')||'<div class="empty">Нічого не знайдено. Змініть пошук або фільтр.</div>'}</div>`}
function pairHTML(p){const a=BY_ID[p.a],b=BY_ID[p.b];return `<section class="panel pair"><h3><span lang="ja">${esc(a.w)} ／ ${esc(b.w)}</span></h3><p>${esc(p.note)}</p><div lang="ja">${ruby(p.jaA)}</div><div class="translation">${esc(p.ukA)}</div><div lang="ja">${ruby(p.jaB)}</div><div class="translation">${esc(p.ukB)}</div></section>`}
function showDetail(id){const x=BY_ID[id];if(!x)return;const ps=peers(id),related=ps.filter(p=>p.type!=='antonym'),ant=ps.filter(p=>p.type==='antonym');document.getElementById('detailBody').innerHTML=`<span class="badge">${x.level} · ${x.id}</span><h2 id="detailTitle" lang="ja">${itemName(x)}</h2><p>${esc(x.c)}</p><h3>${esc(x.t)}</h3>${x.rule?`<div class="rule">${esc(x.rule)}</div>`:''}<p>${esc(x.usage)}</p><div class="example"><div lang="ja">${ruby(x.ja)}</div><div class="translation">${esc(x.uk)}</div></div><div class="row">${button(state.compare.includes(id)?'Прибрати з порівняння':'Додати до порівняння','toggleCompare',`data-id="${id}"`)}${button('S · Знаю','grade',`data-id="${id}" data-grade="S"`)}${button('G · Повторюю','grade',`data-id="${id}" data-grade="G"`)}${button('X · Складно','grade',`data-id="${id}" data-grade="X"`)}</div><p class="muted">Поточний стан: ${gradeLabel(id)}. Самооцінка не дорівнює результату іспиту.</p>${related.length?`<hr class="divider"><h3>${x.kind==='g'?'Близькі та порівнювані конструкції':'Різниця (нюанси)'}</h3>${related.map(p=>{const other=BY_ID[p.a===id?p.b:p.a];return button(esc(other.w),'detail',`data-id="${other.id}"`)+pairHTML(p)}).join('')}`:''}${ant.length?'<hr class="divider"><h3>Антоніми</h3>'+ant.map(p=>{const other=BY_ID[p.a===id?p.b:p.a];return button(esc(other.w),'detail',`data-id="${other.id}"`)+pairHTML(p)}).join(''):''}`;const d=document.getElementById('detail');if(!d.open)d.showModal();d.scrollTop=0}
function toggleCompare(id){if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else{if(state.compare.length>=30){notify('У порівнянні можна тримати не більше 30 карток.');return}state.compare.push(id)}persist();render();if(document.getElementById('detail').open)showDetail(id)}
function compare(){const ids=state.compare.filter(id=>BY_ID[id]),selected=ids.map(id=>BY_ID[id]);const pairs=DATA.pairs.filter(p=>ids.includes(p.a)&&ids.includes(p.b)),related=pairs.filter(p=>p.type!=='antonym'),ant=pairs.filter(p=>p.type==='antonym');return `<h1>Порівняння</h1><p>Додавайте картки обох рівнів. Для двох, трьох і більше позицій показуємо наявні перевірені пояснення пар.</p><div class="row">${button('Вибрати картки','cards')}${button('Очистити список','clearCompare')}</div><div class="cardlist">${selected.map(x=>`<div class="panel"><h3 lang="ja">${esc(x.w)}</h3><p>${esc(x.t)}</p>${button('Відкрити','detail',`data-id="${x.id}"`)} ${button('Прибрати','toggleCompare',`data-id="${x.id}"`)}</div>`).join('')}</div>${selected.length<2?'<p class="empty">Додайте щонайменше дві картки.</p>':''}${related.length?'<h2>Різниця (нюанси)</h2>'+related.map(pairHTML).join(''):selected.length>=2?'<p class="notice">Для цього набору ще немає підготовленого порівняння. Це не означає, що слова є синонімами.</p>':''}${ant.length?'<h2>Антоніми</h2>'+ant.map(pairHTML).join(''):''}`}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function quizPool(){return DATA.questions.filter(q=>inLevel(BY_ID[q.target]))}
function newSession(type,readingId){if(state.session&&state.session.index<state.session.ids.length&&!confirm('Замінити незавершену сесію? Уже записаний прогрес залишиться.'))return;let qs;if(type==='reading'){const r=DATA.readings.find(r=>r.id===readingId);if(!r)return;qs=r.questions.map((_,i)=>Q_BY_ID[r.id+'-q'+i])}else{qs=shuffle(quizPool()).sort((a,b)=>{const priority=q=>{const p=state.progress[q.target];return !p?1:p.due<=Date.now()?0:2};return priority(a)-priority(b)}).slice(0,state.settings.sessionSize)}if(!qs.length){notify('Для обраного рівня ще немає вправ.');return}state.session={type,readingId:readingId||null,ids:qs.map(q=>q.id),orders:qs.map(()=>shuffle([0,1,2,3])),answers:qs.map(()=>null),index:0};persist();go('practice')}
function readingList(){const list=DATA.readings.filter(inLevel);return `<h2>Читання</h2><p class="muted">Пояснення та переклад можна відкрити під текстом. Завершені тексти позначені ✓.</p><div class="readinglist">${list.map(r=>`<button class="item" data-action="startReading" data-id="${r.id}"><span class="badge">${r.level} ${state.seenReadings.includes(r.id)?'✓':''}</span><strong lang="ja">${esc(r.title)}</strong><small>${plain(r.ja).length} знаків · ${r.questions.length} питання</small></button>`).join('')}</div>`}
function practice(){if(!state.session)return `<h1>Вправи й читання</h1><section class="panel"><h2>Коротка сесія</h2><p>${quizPool().length} підготовлених питань у вибраній програмі. Спочатку — картки, які пора повторити, потім нові.</p>${button('Почати '+state.settings.sessionSize+' вправ','startQuiz','','primary')}</section>${readingList()}`;const s=state.session;if(s.index>=s.ids.length){const correct=s.ids.filter((id,i)=>s.answers[i]===Q_BY_ID[id].answer).length;return `<section class="panel"><span class="badge">Сесію завершено</span><h1>${correct} із ${s.ids.length}</h1><p>Це результат цієї вправи, не прогноз бала JLPT. Відповіді збережено.</p>${button('До нових вправ','finish','','primary')}</section>${readingList()}`}
const q=Q_BY_ID[s.ids[s.index]],answer=s.answers[s.index],r=s.type==='reading'?DATA.readings.find(r=>r.id===s.readingId):null;const target=q.target&&BY_ID[q.target];return `<div class="readlayout"><div class="row between"><span>${s.index+1} / ${s.ids.length}</span>${button('До списку вправ','pause')}</div><div class="progress"><i style="width:${s.index/s.ids.length*100}%"></i></div>${r?`<section class="panel"><span class="badge">${r.level} · Читання</span><h1 lang="ja">${esc(r.title)}</h1><div class="reading" lang="ja">${ruby(r.ja)}</div><details><summary>Переклад</summary><p>${esc(r.uk)}</p></details><details><summary>Слова й граматика цього тексту</summary>${r.targets.map(([id,quote])=>`<p>${button(esc(BY_ID[id].w),'detail',`data-id="${id}"`)} <span lang="ja">${esc(quote)}</span></p>`).join('')}<p class="muted">Це перевірені входження форм. Саме входження не означає, що питання перевіряє всі значення картки.</p></details></section>`:''}<section class="panel"><span class="badge">${r?'Розуміння тексту':target.level+' · '+({reading:'Читання слова',cloze:'Форма в контексті',meaning:'Значення'}[q.type])}</span><p class="prompt">${esc(q.prompt)}</p><div>${s.orders[s.index].map(original=>{const cls=answer!==null?(original===q.answer?' correct':original===answer?' wrong':''):'';return `<button class="choice${cls}" data-action="answer" data-index="${original}" ${answer!==null?'disabled':''}>${esc(q.choices[original])}${answer!==null&&original===q.answer?' ✓':''}</button>`}).join('')}</div>${answer!==null?`<div class="feedback"><b>${answer===q.answer?'Правильно.':'Цього разу інша відповідь.'}</b><p>${esc(q.explain)}</p>${q.evidence?`<div lang="ja">${esc(q.evidence)}</div>`:''}</div>${target?button('Відкрити картку','detail',`data-id="${target.id}"`):''} ${button(s.index===s.ids.length-1?'Завершити':'Далі','next','','primary')}`:''}</section></div>`}
function answerQuestion(original){const s=state.session;if(!s||s.index>=s.ids.length||s.answers[s.index]!==null)return;const q=Q_BY_ID[s.ids[s.index]];s.answers[s.index]=original;if(q.target){const old=state.progress[q.target]||{seen:0,correct:0};state.progress[q.target]={grade:original===q.answer?'G':'X',seen:old.seen+1,correct:old.correct+(original===q.answer?1:0),last:Date.now(),due:Date.now()+(original===q.answer?86400000:900000)}}persist();render()}
function nextQuestion(){const s=state.session;if(!s||s.answers[s.index]===null)return;s.index++;if(s.index===s.ids.length&&s.type==='reading'&&!state.seenReadings.includes(s.readingId))state.seenReadings.push(s.readingId);persist();render();window.scrollTo(0,0)}
function grade(id,g){const p=state.progress[id]||{seen:0,correct:0};state.progress[id]={grade:g,seen:p.seen,correct:p.correct,last:Date.now(),due:Date.now()+({S:7*86400000,G:86400000,X:900000}[g])};persist();render();showDetail(id)}
function settings(){return `<h1>Налаштування</h1><section class="panel"><h2>Навчання</h2><div class="setting"><label for="furigana">Показувати фуріґану<br><span class="muted">Картки й тексти. У питанні на читання підказки не з’являються.</span></label><input id="furigana" type="checkbox" ${state.settings.furigana?'checked':''}></div><div class="setting"><label for="includeN5">Додавати повторення N5 у режимі N4</label><input id="includeN5" type="checkbox" ${state.settings.includeN5?'checked':''}></div><div class="setting"><label for="sessionSize">Питань у короткій сесії</label><select id="sessionSize">${[3,6,10].map(n=>`<option ${n===state.settings.sessionSize?'selected':''}>${n}</option>`).join('')}</select></div></section><section class="panel"><h2>Прогрес і резервна копія</h2><p>Стан карток, порівняння й незавершена сесія зберігаються в цьому браузері. Інший файл або браузер можуть мати окреме сховище.</p><div class="row">${button('Експортувати прогрес','export')}<label for="importFile">Імпортувати JSON <input id="importFile" type="file" accept=".json,application/json"></label></div><p class="muted">Імпорт замінює поточний прогрес після підтвердження. Копії тренажера N1 не приймаються. Експорт включає незавершену сесію; якщо її питання відсутні в іншій версії, збережений прогрес карток усе одно можна відновити.</p></section><section class="panel"><h2>Про програму</h2><p>v1: ${DATA.vocab.length} слів, ${DATA.grammar.length} граматичних тем, ${DATA.readings.length} текстів; ${DATA.questions.length} карткових і ${DATA.readings.reduce((n,r)=>n+r.questions.length,0)} текстових питань. Це початкова партія.</p><p>JLPT не публікує сучасного вичерпного списку лексики й граматики. Рівні в нашій програмі — редакторський орієнтир, а не офіційна сертифікація.</p><p><a href="https://www.jlpt.jp/e/faq/" target="_blank" rel="noopener">Офіційні відповіді JLPT</a> · <a href="https://www.jlpt.jp/e/about/levelsummary.html" target="_blank" rel="noopener">Опис рівнів</a> · <a href="https://github.com/tereshchenkopavlo-gif/JLPT-N5-N4" target="_blank" rel="noopener">Проєкт на GitHub</a></p><p>Матеріали авторські. Аудіювання та повний пробний іспит до v1 не входять. Завдання не мають офіційного калібрування JLPT.</p></section>`}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JLPT_N5_N4_progress_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importProgress(file){if(!file)return;try{if(file.size>5e6)throw Error('Файл завеликий для резервної копії.');const next=normalize(JSON.parse(await file.text()));if(!confirm('Замінити поточний прогрес даними з цієї резервної копії?'))return;state=next;persist();render();notify('Прогрес імпортовано.')}catch(e){notify('Імпорт не виконано: '+e.message)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view);return}const a=b.dataset.action,id=b.dataset.id;if(a==='close')document.getElementById('detail').close();else if(a==='detail')showDetail(id);else if(a==='toggleCompare')toggleCompare(id);else if(a==='grade')grade(id,b.dataset.grade);else if(a==='kind'){cardKind=b.dataset.kind;render()}else if(a==='clearCompare'){state.compare=[];persist();render()}else if(a==='cards'||a==='practice')go(a);else if(a==='readings'){go('practice');if(state.session)notify('Спершу завершіть або відкладіть поточну сесію.')}else if(a==='startQuiz')newSession('quiz');else if(a==='startReading')newSession('reading',id);else if(a==='answer')answerQuestion(Number(b.dataset.index));else if(a==='next')nextQuestion();else if(a==='finish'){state.session=null;persist();render()}else if(a==='pause'){view='practice';document.getElementById('main').innerHTML=`<h1>Сесію збережено</h1>${button('Продовжити','practice','','primary')}${button('Почати іншу сесію','startQuiz')}`+readingList()}else if(a==='export')exportProgress()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='level'){state.settings.level=t.value;query='';persist();render()}else if(['furigana','includeN5'].includes(t.id)){state.settings[t.id]=t.checked;persist();render()}else if(t.id==='sessionSize'){state.settings.sessionSize=Number(t.value);persist();render()}else if(t.id==='gradeFilter'){gradeFilter=t.value;render()}else if(t.id==='importFile')importProgress(t.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='search'){const at=e.target.selectionStart;query=e.target.value;render();const s=document.getElementById('search');s.focus();try{s.setSelectionRange(at,at)}catch{}}});
render();
</script></body></html>
